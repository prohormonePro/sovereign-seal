[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-seal"
version = "0.1.0"
description = "Deterministic governance layer for autonomous AI agents. Three functions. One invariant. If it can't prove integrity, it halts."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Travis Dillard", email = "prohormonepro@gmail.com"},
]
keywords = ["ai", "governance", "alignment", "agents", "integrity", "hash-chain", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/prohormonePro/sovereign-seal"
Repository = "https://github.com/prohormonePro/sovereign-seal"
Issues = "https://github.com/prohormonePro/sovereign-seal/issues"

[tool.setuptools.packages.find]
include = ["sovereign_seal*"]
